# Merge-to-main deploy: rebuild into ANALYTICS (prod), then critical-test gate.
# One job, named steps — easy to walk in class.
name: dbt Deploy Prod

on:
  push:
    branches: [main]

env:
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
  SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
  SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
  SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
  SNOWFLAKE_SCHEMA_DEV: ${{ secrets.SNOWFLAKE_SCHEMA_DEV }}
  SNOWFLAKE_SCHEMA_PROD: ${{ secrets.SNOWFLAKE_SCHEMA_PROD }}
  DBT_PROFILES_DIR: ${{ github.workspace }}/dbt_project/.ci_profiles

jobs:
  deploy_prod:
    name: Deploy (prod)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt_project
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create profiles.yml
        run: |
          mkdir -p .ci_profiles
          cp profiles.yml.example .ci_profiles/profiles.yml

      - name: dbt parse
        run: dbt parse --target prod

      - name: dbt build (prod → ANALYTICS)
        run: dbt build --target prod

      - name: dbt test (tag:critical on prod)
        run: dbt test --target prod --select tag:critical

      - name: Upload dbt prod results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-prod-run-results
          path: |
            dbt_project/target/run_results.json
            dbt_project/target/manifest.json
          if-no-files-found: warn

      - name: Deploy summary
        if: always()
        run: |
          {
            echo "## dbt Deploy Prod"
            echo "- Target: \`prod\` → schema \`ANALYTICS\` (not ANALYTICS_DEV)"
            echo "- Promotion = rebuild into the prod schema (tables are not moved)"
            echo "- Gate: \`dbt test --select tag:critical\`"
          } >> "$GITHUB_STEP_SUMMARY"
