# Merge-to-main deploy: one build into ANALYTICS (prod).
# Critical tests run inside `dbt build` — no second test pass.
name: dbt Deploy Prod

on:
  push:
    branches: [main]

env:
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
  SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
  SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
  SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
  SNOWFLAKE_SCHEMA_DEV: ${{ secrets.SNOWFLAKE_SCHEMA_DEV }}
  SNOWFLAKE_SCHEMA_PROD: ${{ secrets.SNOWFLAKE_SCHEMA_PROD }}
  DBT_PROFILES_DIR: ${{ github.workspace }}/dbt_project/.ci_profiles

jobs:
  deploy_prod:
    name: Deploy (prod)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt_project
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create profiles.yml
        run: |
          mkdir -p .ci_profiles
          cp profiles.yml.example .ci_profiles/profiles.yml

      - name: dbt parse
        run: dbt parse --target prod

      - name: dbt build (prod → ANALYTICS)
        run: dbt build --target prod

      - name: Deploy summary
        if: always()
        run: |
          {
            echo "## dbt Deploy Prod"
            echo "- Target: \`prod\` → schema \`ANALYTICS\` (not ANALYTICS_DEV)"
            echo "- Promotion = rebuild into the prod schema (tables are not moved)"
            echo "- Critical tests run inside \`dbt build\` (no second test pass)"
          } >> "$GITHUB_STEP_SUMMARY"
