# PR pipeline: build on ANALYTICS_DEV, then a must-pass critical-test gate.
# Two jobs on purpose — easy to narrate in class (build vs gate).
name: dbt CI

on:
  pull_request:

env:
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
  SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
  SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
  SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
  SNOWFLAKE_SCHEMA_DEV: ${{ secrets.SNOWFLAKE_SCHEMA_DEV }}
  SNOWFLAKE_SCHEMA_PROD: ${{ secrets.SNOWFLAKE_SCHEMA_PROD }}
  DBT_PROFILES_DIR: ${{ github.workspace }}/dbt_project/.ci_profiles

jobs:
  build_dev:
    name: Build (dev)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt_project
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create profiles.yml
        run: |
          mkdir -p .ci_profiles
          cp profiles.yml.example .ci_profiles/profiles.yml

      - name: dbt debug
        run: dbt debug

      - name: dbt parse
        run: dbt parse

      - name: dbt build (dev → ANALYTICS_DEV)
        run: dbt build --target dev

      - name: CI build summary
        if: always()
        run: |
          {
            echo "## dbt CI — Build (dev)"
            echo "- Target: \`dev\` → schema \`ANALYTICS_DEV\`"
            echo "- \`dbt build\` can show WARN on warn_only tests; job is green when ERROR=0"
          } >> "$GITHUB_STEP_SUMMARY"

  gate_critical:
    name: Gate (critical tests)
    needs: build_dev
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt_project
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create profiles.yml
        run: |
          mkdir -p .ci_profiles
          cp profiles.yml.example .ci_profiles/profiles.yml

      - name: dbt test (tag:critical)
        run: dbt test --target dev --select tag:critical

      - name: Upload dbt run results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-ci-run-results
          path: |
            dbt_project/target/run_results.json
            dbt_project/target/manifest.json
          if-no-files-found: warn

      - name: CI gate summary
        if: always()
        run: |
          {
            echo "## dbt CI — Gate (critical)"
            echo "- Must-pass tests only: \`dbt test --select tag:critical\`"
            echo "- Expect: PASS with WARN=0 ERROR=0"
            echo "- warn_only tests are not in this job (same idea as Airflow)"
          } >> "$GITHUB_STEP_SUMMARY"
