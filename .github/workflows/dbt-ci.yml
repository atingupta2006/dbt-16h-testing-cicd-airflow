# PR pipeline: one job — dbt build on ANALYTICS_DEV.
# Critical tests run inside `dbt build` (severity: error). No second test pass (saves warehouse time).
name: dbt CI

on:
  pull_request:

env:
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
  SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
  SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
  SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
  SNOWFLAKE_SCHEMA_DEV: ${{ secrets.SNOWFLAKE_SCHEMA_DEV }}
  SNOWFLAKE_SCHEMA_PROD: ${{ secrets.SNOWFLAKE_SCHEMA_PROD }}
  DBT_PROFILES_DIR: ${{ github.workspace }}/dbt_project/.ci_profiles

jobs:
  build_dev:
    name: Build (dev)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt_project
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create profiles.yml
        run: |
          mkdir -p .ci_profiles
          cp profiles.yml.example .ci_profiles/profiles.yml

      - name: dbt debug
        run: dbt debug

      - name: dbt parse
        run: dbt parse

      - name: dbt build (dev → ANALYTICS_DEV)
        run: dbt build --target dev

      - name: CI summary
        if: always()
        run: |
          {
            echo "## dbt CI — Build (dev)"
            echo "- Target: \`dev\` → schema \`ANALYTICS_DEV\`"
            echo "- \`dbt build\` runs models + all tests once"
            echo "- **Gate:** critical tests (severity error) fail this job if they fail"
            echo "- warn_only may show WARN=2; job stays green when ERROR=0"
          } >> "$GITHUB_STEP_SUMMARY"
