version: 2

models:
  - name: stg_customers
    description: One row per customer.
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique
      - name: customer_city
        tests:
          - not_null:
              severity: warn
              tags: ["warn_only"]

  - name: stg_orders
    description: One row per order.
    columns:
      - name: order_id
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              values: ['delivered', 'shipped', 'processing', 'canceled', 'unavailable', 'invoiced', 'approved', 'created']
      - name: order_delivered_customer_date
        tests:
          # warn on delivered rows with null delivery date (known source edge cases)
          - not_null_if:
              condition_column: order_status
              condition_value: delivered
              severity: warn
              tags: ["warn_only"]

  - name: stg_order_items
    columns:
      - name: order_id
        tests:
          - not_null
      - name: price
        tests:
          - not_null
          - positive_value:
              severity: error
              tags: ["critical"]

  - name: stg_payments
    columns:
      - name: order_id
        tests:
          - not_null
      - name: payment_value
        tests:
          - not_null
          # Olist contains a small number of 0.0 payment_value rows.
          - positive_value:
              severity: warn
              tags: ["warn_only"]

  - name: stg_products
    columns:
      - name: product_id
        tests:
          - not_null
          - unique
