version: 2

models:
  - name: fct_orders
    description: Order-grain fact with customer context and payment/item totals.
    columns:
      - name: order_id
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - not_null
      - name: order_status
        tests:
          - not_null
      - name: total_order_value
        tests:
          - positive_value:
              severity: error
              tags: ["critical"]
      - name: total_payment_value
        tests:
          - positive_value:
              severity: warn
              tags: ["warn_only"]
      - name: order_delivered_customer_date
        tests:
          - not_null_if:
              condition_column: order_status
              condition_value: delivered
              severity: error
              tags: ["critical"]
